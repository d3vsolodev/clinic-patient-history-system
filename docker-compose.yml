services:
  postgres:
    image: postgres:16-alpine
    container_name: clinic-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-clinic_patient_history}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in your environment or .env file}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - clinic-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 12

  backend:
    build: ./backend-java
    container_name: clinic-backend
    environment:
      DB_SERVER: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-clinic_patient_history}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in your environment or .env file}
      DB_SSLMODE: disable
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in your environment or .env file}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?Set JWT_REFRESH_SECRET in your environment or .env file}
      CLIENT_URL: ${CLIENT_URL:-http://localhost:5173,http://localhost:8080}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:5000/api}
    container_name: clinic-frontend
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  clinic-postgres-data:
