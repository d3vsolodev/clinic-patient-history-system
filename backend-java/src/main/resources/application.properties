server.port=${PORT:5000}
server.servlet.context-path=/

spring.application.name=clinic-patient-history-system-backend

# PostgreSQL connection. DB_URL can be set to Supabase's JDBC URI; keep
# sslmode=require for hosted Supabase connections.
spring.datasource.url=${DB_URL:jdbc:postgresql://${DB_SERVER:localhost}:${DB_PORT:5432}/${DB_NAME:clinic_patient_history}?sslmode=${DB_SSLMODE:disable}}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.idle-timeout=30000

# JWT secrets must be supplied by the deployment environment.
jwt.secret=${JWT_SECRET}
jwt.expiresInMinutes=${JWT_EXPIRES_IN_MINUTES:15}
jwt.refreshSecret=${JWT_REFRESH_SECRET}
jwt.refreshExpiresInDays=${JWT_REFRESH_EXPIRES_IN_DAYS:7}

# Cookies
auth.cookie.secure=${AUTH_COOKIE_SECURE:false}

# CORS
client.url=${CLIENT_URL:http://localhost:5173}

logging.level.root=INFO
logging.level.com.clinic=INFO
